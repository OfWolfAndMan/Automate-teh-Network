---
# Lab inventory. Addresses follow docs/addressing-and-placeholder-standard.md:
#   internal plane  10.0.0.0/16     (RFC 1918, synthetic slab)
#   external plane  198.18.0.0/15   (RFC 2544, for anything that must look routable)
# No credential is stored here. Passwords come from the vault file referenced in
# group_vars/all/vars.yml, which is encrypted and git-ignored.
all:
  children:
    network:
      children:
        routers:
          hosts:
            r1:
              ansible_host: 10.0.10.11
            r2:
              ansible_host: 10.0.10.12
        switches:
          hosts:
            sw1:
              ansible_host: 10.0.20.21
            sw2:
              ansible_host: 10.0.20.22
        fabric:
          hosts:
            nx1:
              ansible_host: 10.0.30.31
            eos1:
              ansible_host: 10.0.30.41
            eos2:
              ansible_host: 10.0.30.42
      vars:
        ansible_user: lab
        ansible_password: "{{ vault_ansible_password }}"
        ansible_become: true
        ansible_become_password: "{{ vault_ansible_become_password }}"

    cisco_ios:
      hosts:
        r1:
        r2:
        sw1:
        sw2:
      vars:
        ansible_network_os: cisco.ios.ios
        ansible_connection: network_cli
        ansible_port: 22

    cisco_nxos:
      hosts:
        nx1:
      vars:
        ansible_network_os: cisco.nxos.nxos
        ansible_connection: ansible.netcommon.httpapi
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: false
        ansible_port: 443

    arista_eos:
      hosts:
        eos1:
        eos2:
      vars:
        ansible_network_os: arista.eos.eos
        ansible_connection: network_cli
        ansible_port: 22
