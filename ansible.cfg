[defaults]
# Layout
inventory          = inventories/lab/hosts.yml
collections_path   = ./collections
roles_path         = ./roles

# Behaviour
retry_files_enabled     = False
# lab only: the substrate is disposable
host_key_checking       = False
# network_cli needs no remote interpreter; for linux targets, discover it quietly.
interpreter_python      = auto_silent
deprecation_warnings    = True
gathering               = smart
callbacks_enabled       = profile_tasks

# Vault password is supplied per run: --ask-vault-pass, or ANSIBLE_VAULT_PASSWORD_FILE.
# Do not set vault_password_file here to an empty value: ansible-core reads it as the cwd.

[persistent_connection]
connect_timeout = 60
command_timeout = 60

[inventory]
enable_plugins = yaml, ini
