---
# Collections, pinned to the versions resolved on 2026-11-11 against ansible-core 2.22.0.
# The set is deliberately narrow: only platforms this repository actually carries playbooks
# for. An unused collection is not a capability, it is an upgrade obligation.
#
# Verify after install that the legacy module names still resolve:
#   ansible-doc cisco.ios.ios_config     # etc.
collections:
  - name: ansible.netcommon
    version: ">=8.7.1,<9.0.0"
  # cli_parse lives here as of netcommon 8.x; used directly by playbooks/network/show.yml
  - name: ansible.utils
    version: ">=6.1.1,<7.0.0"
  - name: cisco.ios
    version: ">=11.6.0,<12.0.0"
  - name: cisco.nxos
    version: ">=13.0.0,<14.0.0"
  - name: arista.eos
    version: ">=12.3.0,<13.0.0"
  - name: ansible.posix
    version: ">=2.2.2,<3.0.0"
  - name: community.general
    version: ">=14.0.1,<15.0.0"
  # needed only by the container-backed linux target in inventories/lab
  - name: community.docker
    version: ">=3.10.0,<5.0.0"
