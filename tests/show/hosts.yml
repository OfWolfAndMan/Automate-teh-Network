---
# Offline inventory for playbooks/network/show.yml: two hosts whose `show version` captures
# live in tests/fixtures/show/. Connection is local and nothing logs in; the playbook parses
# the captures with the same ntc-templates parser it uses on live output.
#
#   ansible-playbook -i tests/show/hosts.yml playbooks/network/show.yml \
#     -e 'show_text_file=tests/fixtures/show/{{ inventory_hostname }}_show_version.txt'
all:
  children:
    network:
      vars:
        ansible_connection: local
        ansible_network_os: cisco.ios.ios
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      hosts:
        sw1:
        sw2:
