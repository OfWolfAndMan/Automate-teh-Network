---
# Offline inventory for playbooks/network/compliance.yml: the hosts are the backup fixtures,
# the connection is local, and nothing is collected. It proves the playbook end to end —
# policy load, schema gate, evaluation, report, failure — without a device or a vault.
#
#   ansible-playbook -i tests/compliance/hosts.yml playbooks/network/compliance.yml
#
# Expected (see tests/test_compliance.py for why): IOSV1-10 compliant, SW1-4 violate
# no-domain-lookup, vEOS1-3 compliant.
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    network_compliance_collect: false
    network_compliance_config_path: >-
      {{ inventory_dir }}/../fixtures/backups/{{ inventory_hostname }}/{{ inventory_hostname }}.cfg
  children:
    network:
      children:
        routers:
          vars:
            ansible_network_os: cisco.ios.ios
          hosts:
            IOSV1:
            IOSV2:
            IOSV3:
            IOSV4:
            IOSV5:
            IOSV6:
            IOSV7:
            IOSV8:
            IOSV9:
            IOSV10:
        switches:
          vars:
            ansible_network_os: cisco.ios.ios
          hosts:
            SW1:
            SW2:
            SW3:
            SW4:
        fabric:
          vars:
            ansible_network_os: arista.eos.eos
          hosts:
            vEOS1:
            vEOS2:
            vEOS3:
